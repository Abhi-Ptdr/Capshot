<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFF8EA" />
    <title>CAPSHOT</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      First-paint color baseline. The main stylesheet ships inside the Vite
      module bundle (loads after HTML parse), so without this block the body
      is briefly white before Tailwind's @theme kicks in. The .dark branch
      is driven by the FOUC inline script below. Body intentionally has no
      background so it inherits from html — otherwise a static color on
      <body> would override var(--color-bg) once the stylesheet loads.
    -->
    <style>
      html { background: #FFF8EA; color: #594545; }
      html.dark { background: #594545; color: #FFF8EA; }
      body { margin: 0; min-height: 100dvh; font-family: Inter, system-ui, sans-serif; }
    </style>

    <!--
      Phase 1 Plan 02 FOUC-prevention script. Runs synchronously BEFORE any
      Vite-injected module script so `<html>` carries `.dark` before CSS
      resolves. CONV-04: zero cream-to-dark flash on cold-cache dark loads.
      See UI-SPEC §FOUC Prevention + T-02-02 threat note (no user input flows
      into DOM text/attrs — only a boolean-derived class + a fixed hex).
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('capshot-theme');
          var systemDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && systemDark);
          if (isDark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta)
            meta.setAttribute('content', isDark ? '#594545' : '#FFF8EA');
        } catch (e) {}
      })();
    </script>

    <!-- Whisper (Robert Leuschke) — scoped use: AboutFounder signature mark. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Whisper&display=swap"
      rel="stylesheet"
    />

    <!--
      LCP preload hint for the Hero product shot. The <img> itself is also
      marked loading=eager / decoding=sync / fetchpriority=high so the
      preload lands into the correct priority queue before React mounts.
    -->
    <link
      rel="preload"
      as="image"
      href="/hero/cap-on-bottle.jpg"
      fetchpriority="high"
    />

    <!--
      Phase 1 Plan 03 — Meta Pixel base code (CONV-01).

      Vite replaces %VITE_META_PIXEL_ID% with the env var value at build time
      (per Vite's HTML env substitution). When the env var is unset, Vite
      leaves the literal placeholder; the guard below detects that case by
      checking that %VITE_META_PIXEL_ID% does NOT look like a literal
      placeholder (replace the sentinel substring and compare — if the
      strings are equal, no substitution happened → do NOT call fbq('init')).
      In that case the fbq function stub still exists so trackLead's
      typeof-check branches cleanly, but no PageView fires.

      Server-side CAPI (api/track-lead.ts) picks up the slack when the Pixel
      is missing OR when the client's cookies are stripped (iOS WKWebView —
      research/PITFALLS Pitfall 4).

      Threat note (T-03-06): snippet is static IIFE; %VITE_META_PIXEL_ID% is
      a numeric Pixel ID set in Vercel env (not attacker-controlled). No
      user input flows into DOM text or attrs; no eval; no innerHTML.
    -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = '2.0';
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,
        'script',
        'https://connect.facebook.net/en_US/fbevents.js',
      );
      (function () {
        var raw = '%VITE_META_PIXEL_ID%';
        // Guard: if Vite did NOT substitute the placeholder (env var unset),
        // `raw` will still contain the literal "VITE_META_PIXEL_ID" sentinel.
        // Compare `raw` against raw.replace(sentinel, '_') — equal means the
        // sentinel was NOT present → substitution happened → safe to init.
        if (raw && raw !== raw.replace('VITE_META_PIXEL_ID', '_')) return;
        if (!raw) return;
        try {
          fbq('init', raw);
          fbq('track', 'PageView');
        } catch (e) {
          /* ignore ad-blocker shadow */
        }
      })();
    </script>
    <noscript>
      <img
        height="1"
        width="1"
        style="display: none"
        src="https://www.facebook.com/tr?id=%VITE_META_PIXEL_ID%&ev=PageView&noscript=1"
        alt=""
      />
    </noscript>

    <!--
      Phase 1 hardcoded homepage OG tags. Facebook/Instagram/WhatsApp
      link-preview crawlers do NOT execute JavaScript (unlike Google), so
      the home page's OG must live in the static index.html. Phase 5
      switches per-route OG/Twitter/canonical tags to @unhead/react.

      /og/home.jpg is a known-stub: Phase 5 ships the artwork.
    -->
    <meta
      property="og:title"
      content="CAPSHOT — Twist karo. Shake karo. BOOM."
    />
    <meta
      property="og:description"
      content="Pre-filled flavor caps for any bottle."
    />
    <meta property="og:image" content="/og/home.jpg" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://capshot.co/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
